[Service]
# On AsteroidOS the provider aborts at start-up when this user unit is
# sandboxed: it comes up without a usable session bus connection and
# qFatal()s in main() with "Failed to register object
# /org/freedesktop/Geoclue/Providers/Hybris". Without these three options it
# registers and serves clients normally.
PrivateTmp=no
ProtectHome=no
ProtectSystem=no
